# Quality gates for pull requests targeting protected integration branches.
# Mirrors local start-lint.sh / start-type-check.sh / start-unittest.sh (without auto-upgrades).
name: PR Quality

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: uv run ruff check .
          - name: Type check
            command: uv run ty check
          - name: Unit tests
            command: uv run pytest tests -v --tb=short

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install project and dev dependencies
        run: uv sync --frozen --group dev

      - name: Show tool versions
        run: |
          python --version
          uv --version
          uv run ruff --version
          uv run ty version
          uv run pytest --version

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
