[project]
name = "ccpragents"
version = "0.1.3"
description = "MCP Server For GitHub PR’s Review Process With Full Contexts"
readme = "README.md"
authors = [
    { name = "Trung Dinh", email = "chitrung09t2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.0",
    "pydantic>=2.11.7",
    "fastapi[standard]>=0.116.1",
    "uvicorn>=0.35.0",
    "gunicorn==23.0.0",
    "pygithub>=2.7.0",
    "asyncio>=4.0.0",
    "python-dotenv>=1.1.1",
    "dynaconf>=3.2.11",
    "mcp==1.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccpragents"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.12.11",
]
