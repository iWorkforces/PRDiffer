[project]
name = "ccpragents"
version = "0.4.1"
description = "MCP Server For GitHub PR's Review Process With Full Contexts"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CCWorkforce Engineers" }
]
requires-python = ">=3.14.0"
keywords = ["mcp", "github", "pr-review", "code-review", "diff", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastmcp>=2.13.2",
    "pydantic>=2.12.5",
    "fastapi[standard]>=0.123.0",
    "uvicorn>=0.38.0",
    "pygithub>=2.8.1",
    "asyncer>=0.0.11",
    "anyio>=4.12.0",
    "python-dotenv>=1.2.1",
    "dynaconf>=3.2.12",
    "mcp>=1.22.0",
    "standard>=1.0.3",
    "uvloop>=0.22.1",
    "httptools>=0.7.1",
    "starlette>=0.50.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Repository = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Issues = "https://github.com/CCWorkforce/CCPRAgentsMCP/issues"
Documentation = "https://github.com/CCWorkforce/CCPRAgentsMCP#readme"

[project.scripts]
ccpragents = "ccpragents.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccpragents"]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "mypy>=1.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ccpragents"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "github.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dynaconf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncer.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
