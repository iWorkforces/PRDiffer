[project]
name = "ccpragents"
version = "0.3.6"
description = "MCP Server For GitHub PR's Review Process With Full Contexts"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CCWorkforce Engineers" }
]
requires-python = ">=3.14.0"
keywords = ["mcp", "github", "pr-review", "code-review", "diff", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastmcp>=2.13.1",
    "pydantic>=2.12.4",
    "fastapi[standard]>=0.121.2",
    "uvicorn>=0.38.0",
    "pygithub>=2.8.1",
    "asyncer>=0.0.10",
    "anyio>=4.11.0",
    "python-dotenv>=1.2.1",
    "dynaconf>=3.2.12",
    "mcp>=1.21.2",
    "standard>=1.0.3",
    "uvloop>=0.22.1",
    "httptools>=0.7.1",
    "starlette>=0.49.3",
]

[project.urls]
Homepage = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Repository = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Issues = "https://github.com/CCWorkforce/CCPRAgentsMCP/issues"
Documentation = "https://github.com/CCWorkforce/CCPRAgentsMCP#readme"

[project.scripts]
ccpragents = "ccpragents.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccpragents"]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "mypy>=1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ccpragents"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
