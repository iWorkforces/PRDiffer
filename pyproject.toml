[project]
name = "ccpragents"
version = "0.2.0"
description = "MCP Server For GitHub PR’s Review Process With Full Contexts"
readme = "README.md"
authors = [
    { name = "Trung Dinh", email = "chitrung09t2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.4",
    "pydantic>=2.12.0",
    "fastapi[standard]>=0.119.0",
    "uvicorn>=0.37.0",
    "pygithub>=2.8.1",
    "asyncio>=4.0.0",
    "python-dotenv>=1.1.1",
    "dynaconf>=3.2.12",
    "mcp==1.17.0",
    "standard>=1.0.3",
    "uvloop>=0.21.0",
    "httptools>=0.7.1",
    "locust==2.41.6",
    "starlette>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccpragents"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ccpragents"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
