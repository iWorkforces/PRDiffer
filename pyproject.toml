[project]
name = "ccpragents"
version = "0.4.4"
description = "MCP Server For GitHub PR's Review Process With Full Contexts"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CCWorkforce Engineers" }
]
requires-python = ">=3.14.2"
keywords = ["mcp", "github", "pr-review", "code-review", "diff", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastmcp>=2.14.1",
    "pydantic>=2.12.5",
    "fastapi[standard]>=0.124.4",
    "uvicorn>=0.38.0",
    "pygithub>=2.8.1",
    "asyncer>=0.0.11",
    "anyio>=4.12.0",
    "python-dotenv>=1.2.1",
    "dynaconf>=3.2.12",
    "mcp>=1.24.0",
    "standard>=1.0.3",
    "uvloop>=0.22.1",
    "httptools>=0.7.1",
    "starlette>=0.50.0",
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
    "h2>=4.3.0",
    "hpack>=4.1.0",
    "hyperframe>=6.1.0",
    "aiohttp>=3.13.2",
    "aiodns>=3.6.1",
    "httpx-aiohttp>=0.1.12",
]

[project.urls]
Homepage = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Repository = "https://github.com/CCWorkforce/CCPRAgentsMCP"
Issues = "https://github.com/CCWorkforce/CCPRAgentsMCP/issues"
Documentation = "https://github.com/CCWorkforce/CCPRAgentsMCP#readme"

[project.scripts]
ccpragents = "ccpragents.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccpragents"]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ty>=0.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ccpragents"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ty]
# ty configuration - Astral's fast Python type checker

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "tests/**",
    ".venv/**",
]

# Relax type checking for test files
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"
unresolved-import = "ignore"
